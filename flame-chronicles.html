<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Forged of the Flame — The Chronicles</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600;700&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0b0705 radial-gradient(circle at center,#1c0f0a 0%,#070403 100%);color:#d1c4b9;font-family:Montserrat,sans-serif;padding:40px 20px;min-height:100vh}.container{max-width:1200px;margin:auto}
header{text-align:center;margin-bottom:50px;border-bottom:1px solid rgba(212,163,89,.15);padding-bottom:30px}h1{font-family:'Cinzel Decorative',serif;font-size:clamp(2rem,7vw,3rem);color:#e5a93c;text-shadow:0 0 15px rgba(229,169,60,.4),0 0 2px #ff4500;letter-spacing:4px;text-transform:uppercase}.subtitle{font-family:Cinzel,serif;font-size:.95rem;color:#a38d78;letter-spacing:3px;margin-top:10px;text-transform:uppercase}.back{display:inline-block;margin-bottom:28px;color:#d4a359;text-decoration:none;font-family:Cinzel,serif;letter-spacing:1px}.stats-hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:40px}.stat-box{background:rgba(15,10,8,.85);border:1px solid #7c5a31;padding:15px;text-align:center;border-radius:4px;box-shadow:inset 0 0 10px rgba(0,0,0,.8);position:relative}.stat-label{font-family:Cinzel,serif;font-size:.85rem;color:#a38d78;letter-spacing:1px;display:block;margin-bottom:5px}.stat-value{font-size:1.8rem;font-family:Cinzel,serif;font-weight:700;color:#f7cd83;text-shadow:0 0 8px rgba(247,205,131,.3)}.storyboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:25px}.story-card{background:#0f0b09;border:1px solid #4a341a;border-radius:2px;overflow:hidden;display:flex;flex-direction:column;transition:.4s;position:relative;box-shadow:0 15px 35px rgba(0,0,0,.7)}.story-card:hover{transform:translateY(-5px);border-color:#d4a359;box-shadow:0 20px 40px rgba(229,169,60,.15)}.art-viewport{height:160px;background:#1a120f;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid #362412}.art-viewport:before{content:'';position:absolute;width:150%;height:150%;background:radial-gradient(circle,rgba(230,92,23,.15),transparent 70%);animation:pulseEmber 6s infinite alternate}.panel-number{position:absolute;top:12px;left:12px;background:rgba(7,4,3,.85);border:1px solid #d4a359;color:#d4a359;font-family:Cinzel,serif;font-size:.8rem;width:24px;height:24px;display:flex;align-items:center;justify-content:center;z-index:2}.placeholder-icon{font-size:2.8rem;opacity:.6;filter:drop-shadow(0 0 10px #ff5722)}.card-content{padding:20px;display:flex;flex-direction:column;flex-grow:1;background:linear-gradient(#0f0b09,#090605)}.card-title{font-family:Cinzel,serif;font-size:1.05rem;color:#f1e6da;margin-bottom:8px;letter-spacing:1px;text-transform:uppercase}.card-description{font-size:.8rem;line-height:1.5;color:#9c8e81;margin-bottom:20px;flex-grow:1}.action-btn{background:linear-gradient(#26170f,#140b06);border:1px solid #7c5a31;color:#d4a359;font-family:Cinzel,serif;font-size:.8rem;font-weight:bold;letter-spacing:2px;padding:10px 15px;text-transform:uppercase;cursor:pointer;transition:.2s;width:100%;border-radius:2px}.action-btn:hover{background:linear-gradient(#d4a359,#aa7c3c);color:#070403;border-color:#f7cd83;box-shadow:0 0 15px rgba(212,163,89,.4)}.action-btn:active{transform:scale(.98)}.action-btn.done{opacity:.55;cursor:default}.victory{display:none;margin:35px 0 5px;padding:24px;border:1px solid #d4a359;text-align:center;background:rgba(229,169,60,.08);font-family:Cinzel,serif;color:#f7cd83}.victory.show{display:block}@keyframes pulseEmber{from{transform:scale(1);opacity:.6}to{transform:scale(1.1);opacity:1}}@media(max-width:600px){body{padding:24px 14px}}
</style></head><body><div class="container"><a class="back" href="/">← Return to The Forged Saga</a><header><h1>Forged of the Flame</h1><div class="subtitle">The Original Mythology Begins to Burn</div></header>
<section class="stats-hud"><div class="stat-box"><span class="stat-label">🔥 Flame Power</span><div class="stat-value" id="stat-power">0</div></div><div class="stat-box"><span class="stat-label">👑 Nobility</span><div class="stat-value" id="stat-nobility">0</div></div><div class="stat-box"><span class="stat-label">🤝 Allies Spawned</span><div class="stat-value" id="stat-allies">0</div></div><div class="stat-box"><span class="stat-label">⚔️ Active Soldiers</span><div class="stat-value" id="stat-soldiers">0</div></div></section>
<section class="storyboard-grid" id="grid"></section><div class="victory" id="victory">🔥 THE FLAME IS FORGED 🔥<br><small>You have awakened the first chapter of the Chronicles.</small></div></div>
<script>
const panels=[
["✨","The First Spark","Every legend begins as a spark. The Flame was forged in darkness, born from pain, sacrifice, and choice.","Ignite Spark","power",1],
["🌋","Ancient Forces","The old powers stir beneath the realms. Fire remembers the names the world has forgotten.","Awaken Flame","power",2],
["🗡️","Stephen Rises","A wounded man answers a calling greater than himself and steps toward the fire.","Accept Calling","nobility",1],
["🌬️","Zephyr's Oath","Zephyr stands beside Stephen as destiny draws them toward a war neither fully understands.","Forge Oath","allies",1],
["🐉","Drago Awakens","Drago rises from legend, and the age of dragons begins to return to the world.","Call Drago","allies",1],
["🐲","The Dragon Council","Nyx, Tharros and the ancient dragons gather as the threat beyond the veil grows stronger.","Unite Dragons","allies",2],
["⚔️","The First Battle","Steel meets shadow. The first soldiers answer the Flame and the realm learns the cost of resistance.","Raise Army","soldiers",5],
["🔥","Trial by Fire","Stephen must master the Flame without allowing its power to master him.","Master Flame","power",3],
["👑","The Monarch Trial","Power alone cannot make a ruler. Mercy, courage and sacrifice decide who is worthy.","Choose Mercy","nobility",3],
["🌑","Xarath's Shadow","Darkness crosses the realm and the enemy reveals that the war is larger than any kingdom.","Stand Ground","soldiers",5],
["💎","The Seven Crystals","Fragments of an older covenant awaken, pointing toward secrets that will shape the coming Dragon war.","Seek Crystals","power",2],
["🔥","The Flame Forged","Heroes, dragons and soldiers stand together. The spark has become a fire the darkness cannot ignore.","Forge the Flame","nobility",5]
];
const stats={power:0,nobility:0,allies:0,soldiers:0};let completed=0;
const grid=document.getElementById("grid");
panels.forEach((p,i)=>{const card=document.createElement("div");card.className="story-card";card.innerHTML='<div class="art-viewport"><div class="panel-number">'+(i+1)+'</div><div class="placeholder-icon">'+p[0]+'</div></div><div class="card-content"><h3 class="card-title">'+p[1]+'</h3><p class="card-description">'+p[2]+'</p><button class="action-btn">'+p[3]+'</button></div>';const b=card.querySelector("button");b.onclick=()=>{if(b.classList.contains("done"))return;stats[p[4]]+=p[5];document.getElementById("stat-"+p[4]).textContent=stats[p[4]];b.textContent="Completed";b.classList.add("done");completed++;if(completed===panels.length)document.getElementById("victory").classList.add("show")};grid.appendChild(card)});
</script></body></html>
