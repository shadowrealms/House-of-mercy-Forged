<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Message moderation · Forged Community</title><style>body{margin:0;background:#080604;color:#eee3cf;font-family:Georgia,serif}.wrap{width:min(800px,92%);margin:40px auto}.panel{border:1px solid #70552e;background:#100c08;padding:18px;margin-top:16px}.meta{color:#bcae98;font-size:13px;line-height:1.6}button{padding:10px 13px;margin:10px 8px 0 0;border:1px solid #d5ae67;background:#d5ae67;color:#100b06;font-weight:bold;cursor:pointer}button.reject{background:transparent;color:#d5ae67}</style></head><body><main class="wrap"><a href="index.html#community-stories" style="color:#d5ae67">BACK TO COMMUNITY</a><h1>Private Message Moderation</h1><p class="meta">Approve only respectful member messages. Reject adult content, scams, harassment, threats, spam, impersonation, or any unsafe content. This page is accessible only to configured moderators.</p><p id="status" class="meta">Loading…</p><div id="list"></div></main><script>(()=>{const list=document.getElementById('list'),status=document.getElementById('status'),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function api(url,opt){const r=await fetch(url,opt),d=await r.json();if(!r.ok)throw new Error(d.error||'Request unavailable.');return d}async function load(){try{const d=await api('/api/community/messages?action=moderation');list.innerHTML=(d.messages||[]).map(m=>`<article class="panel"><strong>${esc(m.display_name)}</strong><p>${esc(m.body)}</p><p class="meta">${new Date(m.created_at).toLocaleString()}</p><button data-id="${m.id}" data-status="approved">APPROVE</button><button class="reject" data-id="${m.id}" data-status="rejected">REJECT</button></article>`).join('')||'<p class="meta">No private messages are awaiting review.</p>';status.textContent='Review messages carefully before delivery.'}catch(e){status.textContent=e.message;list.innerHTML=''}}list.addEventListener('click',async e=>{const b=e.target.closest('[data-id]');if(!b)return;try{await api('/api/community/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'moderate',messageId:Number(b.dataset.id),status:b.dataset.status})});load()}catch(e){status.textContent=e.message}});load()})();</script></body></html>
